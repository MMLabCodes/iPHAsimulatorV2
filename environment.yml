name: iphasimulatorchannels:  - conda-forgedependencies:  # ----------------------------------------------------------  # Python and packaging  # ----------------------------------------------------------  - python=3.12  - pip  - setuptools  - wheel  # ----------------------------------------------------------  # Core scientific Python  # ----------------------------------------------------------  - numpy  - scipy  - pandas  - networkx  - pyyaml  - matplotlib  # ----------------------------------------------------------  # Chemistry and molecular modelling  # ----------------------------------------------------------  - rdkit  - openbabel  - ambertools  - parmed  - openmm  - mdtraj  - mdanalysis  # ----------------------------------------------------------  # Polymer-system preparation  # ----------------------------------------------------------  - acpype  # ----------------------------------------------------------  # Testing and development  # ----------------------------------------------------------  - pytest  - jupyterlab  # ----------------------------------------------------------  # Install iPHAsimulator itself  # ----------------------------------------------------------  - pip:      - polyply==1.8.0      - -e .